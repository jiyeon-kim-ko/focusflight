<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusFlight - 토익 콜로케이션 심야 비행</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b132b;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 540px;
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 14px;
        }
        h2.title {
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: #f8fafc;
        }
        p.desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .airport-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 8px;
            padding-right: 4px;
        }
        .airport-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .airport-card.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }
        .airport-card h4 {
            font-size: 0.9rem;
            color: #fbbf24;
        }
        .airport-card p {
            font-size: 0.68rem;
            color: #94a3b8;
        }
        .route-notice {
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            font-size: 0.88rem;
            color: #38bdf8;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .seat-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
        }
        .seat-card.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }
        .seat-card h4 {
            font-size: 0.9rem;
            color: #f8fafc;
            margin-bottom: 2px;
        }
        .seat-card p {
            font-size: 0.65rem;
            color: #94a3b8;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            margin-top: 6px;
        }
        .flight-header {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 0.82rem;
            color: #94a3b8;
        }
        .flight-header span {
            color: #38bdf8;
            font-weight: bold;
        }
        .timer-display {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #38bdf8;
            margin: 12px 0;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .quiz-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .quiz-card:active {
            transform: scale(0.98);
        }
        .quiz-word {
            font-size: 1.35rem;
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .quiz-hint {
            font-size: 0.95rem;
            color: #f8fafc;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .choice-btn {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            word-break: break-all;
        }
        .choice-btn:hover {
            background: #334155;
        }
        .flashcard-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-dontknow {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .btn-know {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .sound-btn {
            background: #334155;
            margin-top: 6px;
            font-size: 0.88rem;
        }
        .sound-btn.active {
            background: #0284c7;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand">✈️ FocusFlight (공유형)</div>

    <!-- Screen 1: 설정 화면 -->
    <div id="setup-screen" class="screen active">
        <h2 class="title">집중 비행 계획 수립</h2>
        <p class="desc">깃허브에서 단어장을 불러와 친구들과 실시간으로 공유됩니다.</p>

        <div class="form-group">
            <label>📂 단어 그룹 선택</label>
            <select id="group-select">
                <option value="">-- 단어장 불러오는 중... --</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: 14px;">
            <label>🗺️ 목적지 공항 선택 (노선)</label>
            <div class="airport-grid" id="airport-grid"></div>
        </div>

        <div class="route-notice" id="route-notice-box">
            ✈️ 선택 노선: ICN ➔ NRT (예상 비행 시간: 20분)
        </div>

        <div class="form-group">
            <label>💺 학습 모드 선택</label>
            <div class="seat-grid">
                <div class="seat-card selected" onclick="setDifficulty('flashcard', this)">
                    <h4>Flashcard</h4>
                    <p>플래시카드 (영어 앞, 뜻 뒤)</p>
                </div>
                <div class="seat-card" onclick="setDifficulty('easy', this)">
                    <h4>Easy</h4>
                    <p>번호 콜로케이션 빈칸</p>
                </div>
                <div class="seat-card" onclick="setDifficulty('normal', this)">
                    <h4>Normal</h4>
                    <p>4지선다 보기</p>
                </div>
                <div class="seat-card" onclick="setDifficulty('hard', this)">
                    <h4>Hard</h4>
                    <p>직접 뜻 입력</p>
                </div>
            </div>
        </div>

        <button class="btn" onclick="startFlight()">비행기 탑승 및 출발</button>
    </div>

    <!-- Screen 2: 퀴즈/플래시카드 화면 -->
    <div id="quiz-screen" class="screen">
        <div class="flight-header">
            <div>항로: <span id="route-info">ICN ➔ ICN</span></div>
            <div>진행: <span id="current-q">1</span> / <span id="total-q">0</span></div>
        </div>

        <div class="timer-display" id="timer">15:00</div>

        <div class="quiz-card" id="card-box" onclick="handleCardClick()">
            <div class="quiz-word" id="q-word">Loading...</div>
            <div class="quiz-hint" id="q-hint">화면을 눌러 뜻 확인하기</div>
        </div>

        <!-- 플래시카드 전용 하단 버튼 -->
        <div id="flashcard-action-area" class="flashcard-buttons" style="display:none;">
            <button class="btn btn-dontknow" onclick="markFlashcard(false)">❌ 안 외움</button>
            <button class="btn btn-know" onclick="markFlashcard(true)">⭕ 외움</button>
        </div>

        <div id="input-area" class="form-group" style="display:none;">
            <input type="text" id="user-answer" placeholder="정답 입력 후 엔터" autocomplete="off">
            <button class="btn" onclick="submitAnswer()">제출하기</button>
        </div>

        <div id="choices-area" class="choices-grid" style="display:none;"></div>

        <button class="btn sound-btn" id="sound-btn" onclick="toggleSound()">🔊 기내 백색소음 켜기</button>
    </div>

    <!-- Screen 3: 결과 화면 -->
    <div id="result-screen" class="screen" style="text-align: center; padding: 20px 0;">
        <h2 class="title">🎉 목적지 안전 도착 완료!</h2>
        <p class="desc" id="result-desc" style="margin-bottom: 20px;"></p>
        <button class="btn" onclick="location.reload()">새로운 비행 준비</button>
    </div>
</div>

<script>
    const airports = [
        { code: "ICN", name: "Seoul", time: 15 },
        { code: "NRT", name: "Tokyo", time: 20 },
        { code: "PEK", name: "Beijing", time: 20 },
        { code: "SIN", name: "Singapore", time: 30 },
        { code: "BKK", name: "Bangkok", time: 30 },
        { code: "SFO", name: "San Francisco", time: 50 },
        { code: "LAX", name: "Los Angeles", time: 55 },
        { code: "JFK", name: "New York", time: 60 },
        { code: "LHR", name: "London", time: 65 },
        { code: "CDG", name: "Paris", time: 65 },
        { code: "SYD", name: "Sydney", time: 55 },
        { code: "DXB", name: "Dubai", time: 50 }
    ];

    let selectedAirport = airports[1];
    let selectedDifficulty = 'flashcard';
    let loadedWordGroups = {};
    let currentQuestions = [];
    let unlearnedQuestions = []; // 안 외운 단어들을 모아둘 배열
    let currentIndex = 0;
    let timeLeft = 900;
    let timerInterval = null;
    let audioCtx = null, noiseNode = null, isSoundOn = false;
    
    // 플래시카드 뒤집힘 상태 관리
    let isCardFlipped = false;

    function initApp() {
        renderAirports();
        loadWordsFromJson();
    }

    function renderAirports() {
        const grid = document.getElementById('airport-grid');
        grid.innerHTML = '';
        airports.forEach((apt, idx) => {
            const card = document.createElement('div');
            card.className = `airport-card ${idx === 1 ? 'selected' : ''}`;
            card.innerHTML = `<h4>${apt.code}</h4><p>${apt.name}</p>`;
            card.onclick = () => {
                document.querySelectorAll('.airport-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedAirport = apt;
                updateRouteNotice();
            };
            grid.appendChild(card);
        });
    }

    function updateRouteNotice() {
        const noticeBox = document.getElementById('route-notice-box');
        noticeBox.textContent = `✈️ 선택 노선: ICN ➔ ${selectedAirport.code} (${selectedAirport.name}) / 예상 비행 시간: ${selectedAirport.time}분`;
    }

    async function loadWordsFromJson() {
        try {
            const response = await fetch('words.json');
            if (!response.ok) throw new Error('파일을 불러오지 못했습니다.');
            loadedWordGroups = await response.json();
            
            const select = document.getElementById('group-select');
            select.innerHTML = '';
            Object.keys(loadedWordGroups).forEach(groupName => {
                const opt = document.createElement('option');
                opt.value = groupName;
                opt.textContent = `${groupName} (${loadedWordGroups[groupName].length}개 단어)`;
                select.appendChild(opt);
            });
        } catch (error) {
            document.getElementById('group-select').innerHTML = '<option value="">-- words.json 파일을 업로드해주세요 --</option>';
        }
    }

    function setDifficulty(diff, el) {
        selectedDifficulty = diff;
        document.querySelectorAll('.seat-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function startFlight() {
        const selectedGroupKey = document.getElementById('group-select').value;
        if (!selectedGroupKey || !loadedWordGroups[selectedGroupKey]) {
            alert("단어 그룹을 선택해주세요.");
            return;
        }

        let wordBank = loadedWordGroups[selectedGroupKey];

        if (selectedDifficulty === 'easy') {
            currentQuestions = wordBank.filter(item => item.hasNumber === true);
            if (currentQuestions.length === 0) currentQuestions = [...wordBank];
        } else {
            currentQuestions = [...wordBank];
        }

        unlearnedQuestions = [];
        currentIndex = 0;
        timeLeft = selectedAirport.time * 60;

        document.getElementById('total-q').textContent = currentQuestions.length;
        document.getElementById('route-info').textContent = `ICN ➔ ${selectedAirport.code}`;

        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            // 한 바퀴 끝났을 때 안 외운 단어가 있다면 그 단어들로 재도전 리스트 세팅
            if (unlearnedQuestions.length > 0) {
                currentQuestions = [...unlearnedQuestions];
                unlearnedQuestions = [];
                currentIndex = 0;
                document.getElementById('total-q').textContent = currentQuestions.length;
                alert("🔄 복습 시간! 앞에서 '안 외움'으로 체크한 단어들만 다시 반복합니다.");
                loadQuestion();
                return;
            } else {
                endFlight(true);
                return;
            }
        }

        document.getElementById('current-q').textContent = currentIndex + 1;
        const current = currentQuestions[currentIndex];
        
        const inputArea = document.getElementById('input-area');
        const choicesArea = document.getElementById('choices-area');
        const flashcardActionArea = document.getElementById('flashcard-action-area');
        const allMeans = currentQuestions.map(q => q.mean);

        if (selectedDifficulty === 'flashcard') {
            inputArea.style.display = 'none';
            choicesArea.style.display = 'none';
            flashcardActionArea.style.display = 'grid';

            isCardFlipped = false;
            document.getElementById('q-word').textContent = current.word;
            document.getElementById('q-hint').textContent = "👆 카드를 누르면 뜻이 나옵니다";
        } else if (selectedDifficulty === 'easy') {
            flashcardActionArea.style.display = 'none';
            inputArea.style.display = 'block';
            choicesArea.style.display = 'none';

            let wordsArr = current.word.split(' ');
            let displayedPhrase = "";
            let hiddenTarget = "";

            if (wordsArr.length > 1) {
                hiddenTarget = wordsArr[wordsArr.length - 1];
                wordsArr[wordsArr.length - 1] = "_____(빈칸)";
                displayedPhrase = wordsArr.join(' ');
            } else {
                hiddenTarget = current.word;
                displayedPhrase = "_____";
            }

            current.hiddenTarget = hiddenTarget;

            document.getElementById('q-word').textContent = displayedPhrase;
            document.getElementById('q-hint').textContent = `뜻: [ ${current.mean} ] (빈칸에 들어갈 단어 입력)`;
            document.getElementById('user-answer').value = '';
            document.getElementById('user-answer').placeholder = "빈칸에 들어갈 단어 입력";

        } else if (selectedDifficulty === 'normal') {
            flashcardActionArea.style.display = 'none';
            inputArea.style.display = 'none';
            choicesArea.style.display = 'grid';
            document.getElementById('q-word').textContent = current.word;
            document.getElementById('q-hint').textContent = "알맞은 뜻을 보기에서 고르세요";

            let choices = [current.mean];
            while(choices.length < 4 && allMeans.length >= 4) {
                let randomMean = allMeans[Math.floor(Math.random() * allMeans.length)];
                if(!choices.includes(randomMean)) choices.push(randomMean);
            }
            choices.sort(() => 0.5 - Math.random());

            choicesArea.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.onclick = () => checkAnswer(choice, current.mean);
                choicesArea.appendChild(btn);
            });
        } else {
            flashcardActionArea.style.display = 'none';
            inputArea.style.display = 'block';
            choicesArea.style.display = 'none';
            document.getElementById('q-word').textContent = current.word;
            document.getElementById('q-hint').textContent = "단어/표현의 뜻을 직접 입력하세요";
            document.getElementById('user-answer').value = '';
            document.getElementById('user-answer').placeholder = "뜻을 입력하세요";
        }
    }

    // 플래시카드 카드 클릭 시 앞/뒤 뒤집기
    function handleCardClick() {
        if (selectedDifficulty !== 'flashcard') return;
        const current = currentQuestions[currentIndex];
        isCardFlipped = !isCardFlipped;

        if (isCardFlipped) {
            document.getElementById('q-word').textContent = current.mean;
            document.getElementById('q-hint').textContent = `💡 뜻 (영어 원문: ${current.word})`;
        } else {
            document.getElementById('q-word').textContent = current.word;
            document.getElementById('q-hint').textContent = "👆 카드를 누르면 뜻이 나옵니다";
        }
    }

    // 플래시카드 하단 버튼 (외움 / 안 외움) 처리
    function markFlashcard(isKnown) {
        const current = currentQuestions[currentIndex];
        if (!isKnown) {
            unlearnedQuestions.push(current); // 안 외운 단어 저장
        }
        currentIndex++;
        loadQuestion();
    }

    function submitAnswer() {
        const userVal = document.getElementById('user-answer').value.trim().toLowerCase();
        const current = currentQuestions[currentIndex];

        if (selectedDifficulty === 'easy') {
            const correctTarget = current.hiddenTarget.trim().toLowerCase();
            if (userVal === correctTarget || userVal.includes(correctTarget)) {
                currentIndex++;
                loadQuestion();
            } else {
                timeLeft -= 30;
                if (timeLeft < 0) timeLeft = 0;
                updateTimerDisplay();
                alert(`⚠️ 난기류 발생! 오답입니다. (정답: ${current.hiddenTarget}) 제한시간 30초가 차감됩니다.`);
                currentIndex++;
                if (timeLeft === 0) { endFlight(false); return; }
                loadQuestion();
            }
        } else if (selectedDifficulty === 'hard') {
            const correctMean = current.mean.trim();
            const inputVal = document.getElementById('user-answer').value.trim();
            if (inputVal !== "" && (correctMean.includes(inputVal) || inputVal.includes(correctMean))) {
                currentIndex++;
                loadQuestion();
            } else {
                timeLeft -= 30;
                if (timeLeft < 0) timeLeft = 0;
                updateTimerDisplay();
                alert(`⚠️ 난기류 발생! 오답입니다. (정답: ${current.mean}) 제한시간 30초가 차감됩니다.`);
                currentIndex++;
                if (timeLeft === 0) { endFlight(false); return; }
                loadQuestion();
            }
        }
    }

    function checkAnswer(userVal, correctVal) {
        const current = currentQuestions[currentIndex];
        if (userVal !== "" && (correctVal.includes(userVal) || correctVal.includes(userVal))) {
            currentIndex++;
            loadQuestion();
        } else {
            timeLeft -= 30;
            if (timeLeft < 0) timeLeft = 0;
            updateTimerDisplay();
            alert(`⚠️ 난기류 발생! 오답입니다. (정답: ${current.mean}) 제한시간 30초가 차감됩니다.`);
            currentIndex++;
            if (timeLeft === 0) { endFlight(false); return; }
            loadQuestion();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endFlight(false);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function endFlight(success) {
        clearInterval(timerInterval);
        stopSound();
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('result-desc').textContent = success ? 
            `ICN에서 ${selectedAirport.code}(${selectedAirport.name})까지의 모든 플래시카드 학습을 완수했습니다!` : 
            "연료(시간)가 소진되어 비행이 중단되었습니다. 다시 도전해 보세요!";
    }

    function toggleSound() {
        const btn = document.getElementById('sound-btn');
        if (!isSoundOn) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = 2 * audioCtx.sampleRate;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 350;
                const gainNode = audioCtx.createGain(); gainNode.gain.value = 0.12;

                noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
                noiseNode.start(0);
                isSoundOn = true;
                btn.textContent = "🔇 기내 백색소음 끄기";
                btn.classList.add('active');
            } catch (e) { alert("오디오 재생 실패"); }
        } else {
            stopSound();
            btn.textContent = "🔊 기내 백색소음 켜기";
            btn.classList.remove('active');
        }
    }

    function stopSound() {
        if (noiseNode) { noiseNode.stop(); noiseNode.disconnect(); noiseNode = null; }
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
        isSoundOn = false;
    }

    document.getElementById('user-answer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAnswer();
    });

    initApp();
</script>

</body>
</html>
